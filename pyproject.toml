[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lodestone"
version = "0.1.0rc8"
description = "Model layer of a local-first AI stack: serves, sizes, leases and tracks the models a site runs on its own hardware."
readme = "README.md"
requires-python = ">=3.10"
license = "Unlicense"
license-files = ["LICENSE"]
dependencies = []

[project.urls]
Homepage = "https://github.com/lottage/lodestone"

[tool.setuptools.packages.find]
include = ["lodestone*"]
