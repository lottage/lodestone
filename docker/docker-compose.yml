# Generated by `python -m lodestone.installer --docker` (profile cpu, CPU only). Edit freely; re-generating writes a backup.
# Engines use llama.cpp's published images (ghcr.io/ggml-org/llama.cpp:server-b10818); the tag is LLAMA_CPP_IMAGE in .env.
# Start:  docker compose up -d --build     The images are built from GitHub (v0.1.0-rc.4), then the models are downloaded (several GB): docker compose logs -f models
# Secrets: none in this file; the API key and the Home Assistant token go in .env.
name: "lodestone"
services:
  # one-shot: downloads the models into the shared volume (resumable; SHA-256 in SHA256SUMS), then exits
  models:
    image: "${LODESTONE_IMAGE:-ghcr.io/lottage/lodestone:0.1.0-rc.4}"
    pull_policy: "never"
    restart: "no"
    command: ["sh", "-c", "python -m lodestone.model_downloader --repo ibm-granite/granite-4.0-h-tiny-GGUF --file granite-4.0-h-tiny-Q4_K_M.gguf --dest /models && python -m lodestone.model_downloader --repo CompendiumLabs/bge-large-en-v1.5-gguf --file bge-large-en-v1.5-f16.gguf --dest /models && cd /models && ( [ \"$$LODESTONE_VERIFY_MODELS\" != 1 ] || sha256sum -c SHA256SUMS )"]
    environment:
      LODESTONE_VERIFY_MODELS: "${LODESTONE_VERIFY_MODELS:-0}"
    volumes: ["models:/models"]

  # coordinator engine (granite-4.0-h-tiny-Q4_K_M.gguf) on the CPU; reachable by the other services only
  coordinator:
    image: "${LLAMA_CPP_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-b10818}"
    restart: "unless-stopped"
    command:
      - "--model"
      - "/models/granite-4.0-h-tiny-Q4_K_M.gguf"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8001"
      - "--device"
      - "none"
      - "-t"
      - "8"
      - "-c"
      - "8192"
      - "-np"
      - "1"
      - "-b"
      - "2048"
      - "-ub"
      - "512"
      - "--flash-attn"
      - "on"
      - "-ctk"
      - "q8_0"
      - "-ctv"
      - "q8_0"
      - "--jinja"
      - "--alias"
      - "coordinator"
      - "--metrics"
      - "--slots"
      - "--props"
    volumes: ["models:/models:ro"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: "15s"
      timeout: "5s"
      retries: 20
      start_period: "120s"
    depends_on:
      models:
        condition: "service_completed_successfully"

  # embedder engine (bge-large-en-v1.5-f16.gguf) on the CPU; reachable by the other services only
  embedder:
    image: "${LLAMA_CPP_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-b10818}"
    restart: "unless-stopped"
    command:
      - "--model"
      - "/models/bge-large-en-v1.5-f16.gguf"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8003"
      - "--device"
      - "none"
      - "-t"
      - "2"
      - "--embedding"
      - "-c"
      - "512"
      - "-b"
      - "512"
      - "-ub"
      - "512"
      - "--alias"
      - "embedder"
      - "--metrics"
    volumes: ["models:/models:ro"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: "15s"
      timeout: "5s"
      retries: 20
      start_period: "120s"
    depends_on:
      models:
        condition: "service_completed_successfully"

  # the one address to use: an OpenAI-compatible API in front of the engines (http://localhost:8000/v1)
  gateway:
    image: "${LODESTONE_IMAGE:-ghcr.io/lottage/lodestone:0.1.0-rc.4}"
    build:
      context: "https://github.com/lottage/lodestone.git#v0.1.0-rc.4"
    restart: "unless-stopped"
    command:
      - "python"
      - "-m"
      - "lodestone.gateway"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
    environment:
      COORDINATOR_URL: "http://coordinator:8001/v1"
      EMBEDDER_URL: "http://embedder:8003/v1"
      LODESTONE_API_KEY: "${LODESTONE_API_KEY:?set LODESTONE_API_KEY in .env}"
      COORDINATOR_CPU: "1"
    ports: ["${LODESTONE_BIND:-127.0.0.1}:${GATEWAY_PORT:-8000}:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: "30s"
      timeout: "5s"
      retries: 5
      start_period: "20s"
    depends_on:
      coordinator:
        condition: "service_healthy"
      embedder:
        condition: "service_healthy"

volumes:
  models: {}
